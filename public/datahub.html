<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Treinrondreis Data Hub</title>
  <link rel="stylesheet" href="/mobile.css" />
  <style>
    .hub{max-width:900px;margin:0 auto;padding:18px}
    .hub h1{margin:.2em 0 .15em}
    .hub .sub{opacity:.75;margin-bottom:18px}
    .statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
    .stat,.source{background:#fff;border:1px solid #d7e0e8;border-radius:12px;padding:14px;color:#16324a}
    .stat b{display:block;font-size:1.6rem}
    .sources{display:grid;gap:10px}
    .source-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .badge{font-size:.8rem;border-radius:999px;padding:4px 8px;background:#e8eef4;white-space:nowrap}
    .badge.live{background:#dff1e5}
    .meta{font-size:.88rem;opacity:.72;margin-top:6px;line-height:1.35}
    .error{background:#fff0f0;border:1px solid #e3a4a4;padding:12px;border-radius:10px}
    @media(max-width:560px){.statgrid{grid-template-columns:1fr}.hub{padding:12px}}
  </style>
</head>
<body>
  <main class="hub">
    <h1>Treinrondreis Data Hub</h1>
    <div class="sub">V4.1 · centrale bron-onafhankelijke treinendatabase · opslagzuinig</div>
    <div id="error" class="error" hidden></div>
    <section class="statgrid" id="stats"></section>
    <section class="sources" id="sources"></section>
  </main>
  <script src="/datahub.js"></script>
</body>
</html>
