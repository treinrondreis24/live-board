<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treindata · Treinreiziger</title><link rel="stylesheet" href="/data-ui.css"></head><body><header><a href="/"><strong>Treinreiziger.nl</strong></a><nav aria-label="Datapagina’s"><a href="/dagverslagen">Dagverslagen</a><a href="/aansluitarchief">Aansluitarchief</a><a href="/treindata.html" aria-current="page">Treindata</a></nav></header><main><h1>Treindata</h1><p>Vergelijk meetpunten en vertragingen over een gekozen periode.</p><div id="train-groups" class="data-groups"></div><form id="filters" class="data-card"><input type="hidden" name="group"><input type="hidden" name="view" value="stops"><div class="data-fields"><label>Vanaf<input type="date" name="from" required></label><label>Tot en met<input type="date" name="to" required></label><label>Treinnummer<input name="train" placeholder="Bijvoorbeeld 225"></label><label>Station (exacte naam)<input name="station" placeholder="Bijvoorbeeld Mannheim Hbf"></label><label>Bron (exacte naam)<input name="source" placeholder="Bijvoorbeeld DB"></label><button class="data-submit">Toon gegevens</button></div><div class="data-shortcuts"><button type="button" data-days="1">Dag</button><button type="button" data-days="7">Week</button><button type="button" data-days="30">30 dagen</button><button type="button" id="clear">Filters wissen</button></div><div class="data-tabs" role="group" aria-label="Weergave"><button type="button" data-view="stops">Meetpunten</button><button type="button" data-view="ranking">Top 25</button></div><label id="sort-field">Rangschikken <select name="sort"><option value="max">Grootste vertraging</option><option value="frequency">Vaakst ≥5 min vertraagd (%)</option><option value="cancelled">Dagen met annulering</option></select></label></form><section class="data-card" style="margin-top:20px"><h2 id="results-title">Meetpunten</h2><p id="status" role="status"></p><div class="table-wrap" id="results"></div><p class="data-paging"><button id="previous" hidden>Vorige 100</button><button id="next" hidden>Volgende 100</button></p></section><details style="margin-top:20px"><summary>Over deze gegevens en meetdekking</summary><p id="coverage" class="notice"></p></details></main><script type="module" src="/treindata.js"></script></body></html>
