<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treinhuis-beheerders</title><link rel="stylesheet" href="/admin-security.css"><script src="/stationschef/treinhuis-gebruikers.js" defer></script></head><body><main><h1>Treinhuis-beheerders</h1><a href="/stationschef">Terug naar Stationschef</a><p>Deze accounts hebben uitsluitend toegang tot Kilometerkampioen-beheer. Activatielinks zijn persoonlijk, werken één keer en verlopen na 48 uur. Deel ze zelf met de betreffende beheerder.</p><div id="users"></div><form id="create"><label>Gebruikersnaam<input name="name" required minlength="3" maxlength="80" autocomplete="off"></label><label>E-mailadres<input name="email" type="email" required maxlength="254"></label><button>Account aanmaken</button></form><p id="message" role="status"></p><label id="link-label" hidden>Persoonlijke activatielink<input id="activation" readonly></label></main></body></html>
