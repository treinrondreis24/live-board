<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uw reisgids · Treinrondreis</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#183c3c;font:16px/1.6 system-ui,sans-serif}header{background:#183c3c;color:white;padding:22px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}header small{display:block;color:#b9d6cd}a{color:inherit}button,.button{font:inherit;cursor:pointer;background:white;color:#183c3c;border:1px solid #cddbd2;border-radius:10px;padding:10px 16px;text-decoration:none;display:inline-block}main{max-width:1100px;margin:auto;padding:30px 20px}.hero{display:grid;grid-template-columns:1fr 260px;gap:40px;align-items:center;margin:0 0 35px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#447c69}h1{font-size:clamp(28px,5vw,46px);line-height:1.1;margin:12px 0 18px}h2{font-size:22px}.cover{width:100%;max-height:230px;object-fit:contain;filter:drop-shadow(0 6px 12px #0002)}.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.chapter{text-align:left;display:flex;gap:14px;align-items:center;min-height:76px}.chapter b{font-size:13px;color:#51856c}.chapter span{display:block;line-height:1.4}.chapter small{display:block;color:#6b7c75}.chapter.active{background:#dfece4;border-color:#438066}.reader{margin-top:30px;border-top:1px solid #cddbd2;padding-top:20px}.reader-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pages{max-width:100%;overflow:auto}.sheet{margin:20px auto;width:100%}.sheet img{display:block;width:100%;height:auto;background:white;box-shadow:0 4px 15px #0002}.sheet figcaption{text-align:center;font-size:12px;color:#62736c;margin-top:6px}.zoom .sheet{width:1400px;max-width:none}.notice{padding:16px;background:#fff1d8;border-radius:10px}.mobile{max-width:420px}.mobile .hero{grid-template-columns:1fr}.mobile .cover{display:none}.mobile .chapters{grid-template-columns:1fr}.muted{font-size:13px;color:#60736a}@media(max-width:600px){header{padding:15px;align-items:flex-start;font-size:14px}.hero{grid-template-columns:1fr;gap:15px}.cover{max-height:190px}.chapters{grid-template-columns:1fr}main{padding:22px 16px}.hero{margin-bottom:24px}}:focus-visible{outline:3px solid #bf873a;outline-offset:3px}</style>
<header><div><strong>TREINRONDREIS</strong><small>Uw persoonlijke reisgids</small></div><a class="button" href="/">Boekjesmaker</a></header><main id="guide"><p>Uw reisgids wordt geladen…</p></main>
<script>
const id=location.pathname.split('/').pop(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,current=-1;
async function init(){try{const r=await fetch('/api/digital/'+id);if(!r.ok)throw Error(r.status===401?'Log eerst in bij Boekjesmaker en open deze digitale proef daarna opnieuw.':'Deze reisgids kon niet worden geladen.');data=await r.json();document.title=data.title+' · Treinrondreis';document.querySelector('#guide').innerHTML=`<section class="hero"><div><span class="eyebrow">Uw reis begint hier</span><h1>${esc(data.title)}</h1><p>Alles voor uw treinreis op één plek. Bekijk de hoofdstukken of download het complete boekje voor onderweg.</p><a class="button" href="/files/export/${id}?download=1">Download reisboekje</a> <button onclick="document.querySelector('main').classList.toggle('mobile')">Telefoonweergave</button><p class="muted">Digitale proef · versie ${esc(data.created)} · ${data.pages} ${data.pages===1?'pagina':'pagina’s'}</p></div><img class="cover" src="/files/export-preview/${id}/0" alt="Omslag van uw reisboekje"></section><h2>Ontdek uw reis</h2><nav class="chapters" aria-label="Hoofdstukken">${data.chapters.map((c,i)=>`<button class="chapter" data-chapter="${i}" onclick="showChapter(${i})"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(c.title)}<small>Pagina ${c.page}${c.end>c.page?' – '+c.end:''}</small></span></button>`).join('')}</nav><section class="reader" id="reader"><div class="reader-head"><h2 id="chapterTitle">Het complete reisboekje</h2><div><button onclick="showChapter(-1)">Alles bekijken</button> <button onclick="document.querySelector('.pages').classList.toggle('zoom')">Vergroten / passend</button></div></div><div class="pages" id="pages"></div></section>`;showChapter(-1,false)}catch(e){document.querySelector('#guide').innerHTML='<p class="notice">'+esc(e.message)+'</p><a class="button" href="/">Naar Boekjesmaker</a>'}}
function showChapter(i,scroll=true){current=i;const chapter=i<0?{title:'Het complete reisboekje',page:1,end:data.pages}:data.chapters[i];document.querySelector('#chapterTitle').textContent=chapter.title;document.querySelectorAll('[data-chapter]').forEach(b=>b.classList.toggle('active',Number(b.dataset.chapter)===i));document.querySelector('#pages').innerHTML=(chapter.pageNumbers||Array.from({length:chapter.end-chapter.page+1},(_,n)=>chapter.page+n)).map(p=>{return `<figure class="sheet"><img loading="lazy" src="/files/export-preview/${id}/${p-1}" alt="${esc(chapter.title)} — pagina ${p}" onerror="this.alt='Deze pagina kon niet worden geladen. Download het PDF-boekje via de knop bovenaan.'"><figcaption>Pagina ${p} van ${data.pages}</figcaption></figure>`}).join('');if(scroll)document.querySelector('#reader').scrollIntoView({behavior:'smooth'})}
init();
</script></html>
