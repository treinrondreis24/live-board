<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokale bibliotheek overzetten</title>
<style>body{font:17px/1.6 system-ui;max-width:750px;margin:50px auto;padding:20px;color:#183c3c}button{padding:12px;margin:20px 0}progress{width:100%}</style>
<h1>Lokale bibliotheek overzetten</h1><p>Kies het importmanifest en alle bijbehorende delen. Dit werkt alleen zolang de online bibliotheek leeg is. Accounts en aanmeldgegevens worden niet meegenomen.</p>
<input type="file" multiple id="files"><br><button id="start">Importeren</button><progress id="progress" value="0" max="1"></progress><p id="status" role="status"></p><a href="/seinhuis/boekjesmaker/">Naar de boekjesmaker</a>
<script>
const status=document.querySelector('#status'),button=document.querySelector('#start'),progress=document.querySelector('#progress');
async function post(path,body,type='application/json'){const r=await fetch('/seinhuis/boekjesmaker/api/migration/'+path,{method:'POST',headers:{'X-Booklets':'1','Content-Type':type},body});const result=await r.json();if(!r.ok)throw Error(result.error);return result;}
button.onclick=async()=>{button.disabled=true;try{const files=Array.from(document.querySelector('#files').files),info=files.find(f=>f.name==='import.json');if(!info)throw Error('Kies ook import.json.');const manifest=JSON.parse(await info.text());for(let i=0;i<manifest.files.length;i++){const entry=manifest.files[i],file=files.find(f=>f.name===entry.name);if(!file)throw Error('Ontbrekend deel: '+entry.name);status.textContent='Overzetten: deel '+(i+1)+' van '+manifest.files.length;await post('part?index='+i+'&sha256='+entry.sha256,file,'application/octet-stream');progress.value=(i+1)/manifest.files.length;}status.textContent='Alle bestanden controleren en bibliotheek openen…';const result=await post('finish',JSON.stringify({parts:manifest.files.length,sha256:manifest.sha256}));status.textContent='Overgezet: '+result.counts.objects+' bibliotheekitems en '+result.counts.exports+' drukversies.';}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
