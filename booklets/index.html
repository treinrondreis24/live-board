<style>

10px #0002}.tag{display:inline-block;border-radius:20px;background:#eef3ee;padding:3px 9px;font-size:12px;margin:6px 0}.empty{padding:55px 25px;text-align:center;background:white;border:1px dashed #b6c7bd;border-radius:14px;margin-top:25px}.two{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1fr);gap:22px;margin-top:22px}.panel{background:white;padding:22px;border:1px solid var(--line);border-radius:13px}.section{border:1px solid var(--line);background:white;border-radius:9px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:center}.section img{width:44px;height:62px;object-fit:contain;background:#eee}.section .grow{flex:1}.check{display:flex;align-items:center;gap:8px;font-weight:400}.check input{width:auto}.preview{position:relative;width:100%;border:1px solid var(--line);background:white;cursor:crosshair;line-height:0}.preview img{width:100%;display:block}.fieldbox{position:absolute;border:2px dashed #c07c2c;background:#ffcf6b44;line-height:1.2;font-size:12px;overflow:hidden;pointer-events:none}.fieldbox.selected{border-color:#207760;background:#72cfa455}dialog{border:0;border-radius:15px;box-shadow:0 20px 100px #0004;width:min(1100px,94vw);max-height:93vh;padding:26px;color:var(--ink)}dialog::backdrop{background:#10272280}dialog .two{grid-template-columns:1fr 350px}.fields{max-height:65vh;overflow:auto;padding-right:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.login{max-width:470px;margin:10vh auto;background:white;padding:34px;border-radius:16px;border:1px solid var(--line)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 22px;background:#193f37;color:white;border-radius:10px;z-index:10;max-width:85vw;box-shadow:0 4px 25px #0002}a{color:var(--green)}.history{border-top:1px solid var(--line);padding:12px 0}.error{background:#ffede5;color:#8a3423;padding:12px;border-radius:8px}.foot{position:absolute;bottom:25px;font-size:12px;color:#bdd7c9}.introline{max-width:680px}button:disabled{opacity:.5;cursor:wait}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{height:auto;position:static;padding:15px}.brand{margin:0}nav{display:flex}nav button{width:auto}.foot{display:none}main{padding:20px}.two,dialog .two{grid-template-columns:1fr}.bar{align-items:flex-start;flex-wrap:wrap}}

.library-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}.library-cards .section{margin:0;padding:10px;align-items:flex-start}.library-cards .grow{min-width:0;overflow-wrap:anywhere}.library-cards p{margin:3px 0}.library-cards .tag{margin:2px 0}.library-cards h3{font-size:14px}.library-filter-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:850px){.library-filter-row{grid-template-columns:1fr 1fr}}details.choice-summary>summary{cursor:pointer;padding:10px 0}#libraryResults{scroll-margin-top:15px}.block-picker{display:flex;flex-direction:column;height:80vh;min-height:350px}.block-picker>.panel{margin:10px 0!important;padding:12px;flex-shrink:0}.block-picker h2{margin-bottom:3px}.block-picker #pickerResults{flex:1;min-height:120px;overflow-y:auto;margin-top:8px;padding-right:8px}.block-picker .bar{flex-shrink:0}.block-picker #pickerResults .empty{margin-top:8px;padding:20px}.block-picker #pickerResults .section{margin:6px 0}@media(max-height:650px){.block-picker{height:80vh;min-height:280px}.block-picker .panel label{margin-top:2px}.block-picker .panel input,.block-picker .panel select{padding:5px}.block-picker .library-filter-row{grid-template-columns:repeat(4,minmax(0,1fr))}}.button{display:inline-block;padding:9px 14px;border:1px solid #bccbc3;border-radius:8px;background:white;text-decoration:none}.block-picker #pickerFeedback{margin:5px 0}.library-filter-row{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.picker-add-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}.picker-added{display:inline-flex;align-items:center;gap:5px;color:#167044;font-weight:700;min-width:32px}.picker-tick{font-size:34px;line-height:1}.picker-times{font-size:16px}.picker-add-button{font-size:16px;font-weight:600;padding:12px 19px;min-height:46px}.block-picker #pickerResults .section{align-items:center}@media(max-width:600px){.picker-add-actions{gap:6px}.picker-add-button{padding:10px 12px}.picker-tick{font-size:29px}}</style>

<div id="app"><p style="padding:32px">Boekjesmaker wordt geladen…</p></div><dialog id="modal"></dialog><div id="toast" hidden></div>

<script>
window.addEventListener('error',event=>{document.querySelector('#app').textContent='Laden niet gelukt: '+event.message});
</script>
<script>

let fitExamples={},fitRun=0;

let state={objects:[],exports:[]},user=null,view='books',draft=null,editor=null,selectedField=-1,previewPage=0,dirty=false;

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const clone=x=>structuredClone(x);const byKind=k=>state.objects.filter(o=>o.kind===k);const find=id=>state.objects.find(o=>o.id===id);

function toast(t){const modal=$('#modal');if(modal.open){let box=$('#modalMessage');if(!box){box=document.createElement('div');box.id='modalMessage';box.className='error';box.setAttribute('role','alert');box.style.cssText='position:sticky;top:0;z-index:5;margin-bottom:12px';modal.prepend(box)}box.textContent=t;box.scrollIntoView({block:'nearest'});return}$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,6500)}

async function api(path,b,raw=false){const r=await fetch(path,b===undefined?{signal:AbortSignal.timeout(30000)}:{method:'POST',headers:{'X-Booklets':'1','Content-Type':raw?'application/pdf':'application/json'},body:raw?b:JSON.stringify(b),signal:AbortSignal.timeout(180000)});const data=await r.json();if(!r.ok)throw Error(data.error||'Verzoek mislukt');return data}

async function run(fn){try{await fn()}catch(e){toast(e.message)}}

async function refresh(){state=await api('/api/state')}

function leave(){return !dirty||confirm('Er zijn niet opgeslagen wijzigingen. Wilt u die verlaten?')}

window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

function shell(){ $('#app').innerHTML=`<div class="layout"><aside><div class="brand">Treinrondreis<small>BOEKJESMAKER · PROEFVERSIE</small></div><nav><a href="/seinhuis" style="color:white;display:block;padding:12px">← Seinhuis</a><button class="${view==='books'?'active':''}" onclick="navigate('books')">▤ &nbsp; Boekingen</button><button class="${view==='templates'?'active':''}" onclick="navigate('templates')">▧ &nbsp; Reissjablonen</button><button class="${view==='library'?'active':''}" onclick="navigate('library')">▦ &nbsp; Bibliotheek</button></nav><div class="foot">${esc(user.name)}<br><button class="small" onclick="logout()">Uitloggen</button><p>Beveiligd via Seinhuis<br>Google-bronnen op aanvraag<br>Geen AI-verwerking</p></div></aside><main id="main"></main></div>`;render()}

function navigate(v){if(!leave())return;dirty=false;draft=null;view=v;shell()}

let bookingSearch='',bookingTrash=false;

function render(){if(draft)return renderDraft();let m=$('#main');if(view==='library'){m.innerHTML=`<div class="bar"><div><h1>De bouwstenen van elke reis</h1><p class="muted">Zoek en combineer filters. Een bouwsteen kan meerdere categorieën en labels hebben.</p></div><div class="actions"><button onclick="googleSettings()">Google koppelen</button><button onclick="googleImport()">+ Google Docs toevoegen</button><button class="primary" onclick="uploadBlock()">+ PDF toevoegen</button></div></div><label class="check"><input type="checkbox" ${reuseLastMetadata?'checked':''} onchange="reuseLastMetadata=this.checked">Instellingen en invulvelden van de vorige PDF overnemen</label><p class="muted">Categorieën, labels, land, type pagina, verbergen in inhoudsopgave en alle velden met tekst, positie en opmaak. Velden blijven op hetzelfde paginanummer staan.</p><details class="choice-summary"><summary>Herbruikbare keuzepagina’s beheren</summary>${sharedChoiceList()}</details>${browserControls(false)}${libraryDisplayControls()}<div id="libraryResults"></div>`;drawLibrary(false);return}

 const kind=view==='templates'?'template':'book',items=byKind(kind).filter(o=>kind!=='book'||!!o.body.deletedAt===bookingTrash);m.innerHTML=`<div class="bar"><div><h1>${kind==='book'?'Van reis naar persoonlijk boekje':'Een goed begin voor elke standaardreis'}</h1><p class="muted">${kind==='book'?'Kies een reissjabloon of stel een maatwerkboekje samen.':'Bewaar de vaste hoofdstukken en hun volgorde. Boekingen blijven afzonderlijk aanpasbaar.'}</p></div><button class="primary" onclick="newDraft('${kind}')">+ ${kind==='book'?'Boekje maken':'Sjabloon maken'}</button></div><div class="notice">A4 staand en A5 liggend. Beveiligde online proefversie via Seinhuis. Laat vóór bestellen een proefdruk beoordelen.</div>${kind==='book'?`<div class="panel"><label for="bookingSearch">Zoek boekingen</label><input id="bookingSearch" value="${esc(bookingSearch)}" placeholder="Boekingsnummer, naam, bestemming of status…" oninput="bookingSearch=this.value;filterBookings()"><label class="check"><input type="checkbox" ${bookingTrash?'checked':''} onchange="bookingTrash=this.checked;render()">Prullenbak tonen</label><p class="muted" id="bookingCount"></p></div>`:''}<div class="grid">${items.map(o=>`<article class="card" ${kind==='book'?`data-book-id="${o.id}"`:''}><div class="pad"><span class="tag">${kind==='book'?esc(o.body.status||'Concept'):'Reissjabloon'}</span><h3>${esc(o.title)}</h3><p class="muted">${o.body.sections.length} bouwstenen · versie ${o.revision}</p><div class="actions">${o.body.deletedAt?`<button onclick="trashBook('${o.id}',true)">Herstellen</button>`:`<button onclick="openDraft('${o.id}')">Openen</button>${kind==='book'?`<button onclick="trashBook('${o.id}',false)">Verwijderen</button>`:''}`}${kind==='template'?`<button class="primary" onclick="fromTemplate('${o.id}')">Gebruik</button>`:''}</div></div></article>`).join('')}</div>${items.length?'':'<div class="empty"><h2>Nog geen '+(kind==='book'?'boekingen':'sjablonen')+'</h2><p>Voeg bouwstenen toe en bewaar een eerste samenstelling.</p></div>'}${kind==='book'?'<div id="noBookingMatches" class="empty" hidden>Geen boekingen gevonden. Pas de zoekterm aan.</div>':''}`;if(kind==='book')filterBookings() }

const libraryFilters={q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false};

const pickerFilters={q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false};

const pageTypes=['Route','Voorpagina','Alleen tekst','Alleen foto','Foto & tekst','Inhoudsopgave','Gemengd','Overig'];

const norm=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function uniqueValues(values){const seen=new Set();return values.filter(v=>{v=String(v).trim();if(!v||seen.has(norm(v)))return false;seen.add(norm(v));return true}).sort((a,b)=>a.localeCompare(b,'nl'))}

function categories(b){return b.categories?.length?b.categories:[b.category||'Algemeen']}

function vocab(key){return uniqueValues(byKind('block').flatMap(o=>key==='category'?categories(o.body):key==='tag'?(o.body.tags||[]):[o.body[key]|| (key==='country'?'Algemeen':'Nog niet ingedeeld')]))}

function browserControls(pick){const f=pick?pickerFilters:libraryFilters;return `<div class="panel" style="margin:18px 0"><label>Zoeken</label><input value="${esc(f.q)}" placeholder="Naam, categorie, land of label…" oninput="setLibraryFilter(${pick},'q',this.value)"><div class="library-filter-row">${[['category','Categorie'],['country','Land'],['pageType','Type pagina'],['tag','Label'],['format','Formaat']].map(([k,label])=>`<div><label>${label}</label><select onchange="setLibraryFilter(${pick},'${k}',this.value)"><option value="">Alle</option>${vocab(k).map(v=>`<option value="${esc(v)}" ${f[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`).join('')}</div>${pick?'':`<label class="check"><input type="checkbox" ${f.archived?'checked':''} onchange="setLibraryFilter(false,'archived',this.checked)">Ook gearchiveerde bouwstenen tonen</label>`}</div>`}

function setLibraryFilter(pick,k,v){(pick?pickerFilters:libraryFilters)[k]=v;drawLibrary(pick)}

function matchingBlocks(f){return byKind('block').filter(o=>{const b=o.body;if(b.archived&&!f.archived)return false;const cs=categories(b),tags=b.tags||[],country=b.country||'Algemeen',pt=b.pageType||'Nog niet ingedeeld';const text=norm([o.title,...cs,country,pt,...tags].join(' '));return (!f.format||b.format===f.format)&&norm(f.q).split(/\s+/).every(word=>text.includes(word))&&(!f.category||cs.some(v=>norm(v)===norm(f.category)))&&(!f.country||norm(country)===norm(f.country))&&(!f.pageType||norm(pt)===norm(f.pageType))&&(!f.tag||tags.some(v=>norm(v)===norm(f.tag)))}).sort((a,b)=>a.title.localeCompare(b.title,'nl'))}



function canonicalList(value,key){const known=vocab(key);return uniqueValues(value.split(',').map(v=>v.trim()).filter(Boolean).map(v=>known.find(x=>norm(x)===norm(v))||v))}

function metadataEditor(b){return `<label>Categorieën (gescheiden door komma’s)</label><input value="${esc(categories(b).join(', '))}" oninput="editor.body.categories=canonicalList(this.value,'category')"><select aria-label="Bestaande categorie toevoegen" onchange="addMetadata('categories',this.value);this.value='' "><option value="">Bestaande categorie toevoegen…</option>${uniqueValues(['Algemeen','Routes','Bestemming','Trein','Praktisch',...vocab('category')]).map(v=>`<option>${esc(v)}</option>`).join('')}</select><label>Land</label><input list="countryChoices" value="${esc(b.country||'Algemeen')}" onchange="editor.body.country=vocab('country').find(v=>norm(v)===norm(this.value))||this.value.trim()||'Algemeen';renderEditor()"><datalist id="countryChoices">${uniqueValues(['Algemeen',...(state.countries||[]),...vocab('country')]).map(v=>`<option value="${esc(v)}">`).join('')}</datalist><label>Type pagina</label><select onchange="editor.body.pageType=this.value"><option value="">Nog niet ingedeeld</option>${pageTypes.map(v=>`<option ${b.pageType===v?'selected':''}>${v}</option>`).join('')}</select><p class="muted">Voor een bouwsteen met verschillende pagina-indelingen kiest u Gemengd.</p><label>Labels (gescheiden door komma’s)</label><input value="${esc((b.tags||[]).join(', '))}" oninput="editor.body.tags=canonicalList(this.value,'tag')"><select aria-label="Bestaand label toevoegen" onchange="addMetadata('tags',this.value);this.value='' "><option value="">Bestaand label toevoegen…</option>${vocab('tag').map(v=>`<option>${esc(v)}</option>`).join('')}</select>`}

function addMetadata(key,value){if(!value)return;editor.body[key]=uniqueValues([...(key==='categories'?categories(editor.body):(editor.body.tags||[])),value]);renderEditor()}

function filterCards(q){document.querySelectorAll('[data-search]').forEach(e=>e.hidden=!e.dataset.search.includes(q.toLowerCase()))}

function newDraft(kind){if(!leave())return;draft={kind,title:'',body:{format:'A4',sections:[],values:{},duplex:true,status:'Concept',binding:'wire-o'}};dirty=true;renderDraft()}

function openDraft(id){draft=clone(find(id));dirty=false;renderDraft()}

function fromTemplate(id){if(!leave())return;run(async()=>{await refresh();dirty=false;newDraft('book');draft.body=clone(find(id).body);refreshDraftBlocks();draft.body.values={};draft.body.status='Concept';draft.title='';draft.body.templateName=find(id).title;renderDraft()})}

function setTitle(v){draft.title=v;dirty=true}

function setValue(k,v){draft.body.values[k]=v;dirty=true}

function snapshot(o){return {block:o.id,revision:o.revision,title:o.title,asset:o.body.asset,pages:o.body.pages,fields:clone(o.body.fields||[]),numberingConfigured:!!o.body.numberingConfigured,tocTitle:o.body.tocTitle||'',tocHidden:!!o.body.tocHidden,googleDoc:o.body.googleDoc?clone(o.body.googleDoc):undefined,recto:false,values:{}}}

function fieldKeys(f){if(['contents','pageNumber'].includes(f.type))return [];return f.type==='text'?[...new Set([...String(f.template||'').matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)].map(m=>m[1].trim()))]:[f.key]}

function keys(){return [...new Set(activeSections().flatMap(s=>(s.fields||[]).filter(f=>f.type!=='prefilled').flatMap(fieldKeys)))]}

function pageCount(){let p=0;activeSections().forEach(s=>{if(draft.body.duplex&&s.recto&&p%2)p++;p+=s.pages});return p}

function renderDraft(){const isBook=draft.kind==='book';$('#main').innerHTML=`<div class="bar"><div><button class="small" onclick="navigate('${isBook?'books':'templates'}')">← Overzicht</button><h1 style="margin-top:12px">${isBook?'Stel het reisboekje samen':'Maak een reissjabloon'}</h1></div><div class="actions"><button onclick="saveAs()">Bewaar als nieuw sjabloon</button><button class="primary" onclick="saveDraft()">Opslaan</button></div></div><div class="two"><div><div class="panel"><label>Naam ${isBook?' / boekingsnummer':''}</label><input value="${esc(draft.title)}" placeholder="Bijvoorbeeld 6618A · Verona en Venetië" oninput="setTitle(this.value)"><div class="row"><div><label>Formaat</label><select onchange="changeFormat(this.value)"><option value="A4" ${(draft.body.format||'A4')==='A4'?'selected':''}>A4 staand</option><option value="A5" ${draft.body.format==='A5'?'selected':''}>A5 liggend</option></select><label>Drukuitvoering</label><select onchange="draft.body.duplex=this.value==='true';dirty=true;renderDraft()"><option value="true" ${draft.body.duplex?'selected':''}>Dubbelzijdig</option><option value="false" ${!draft.body.duplex?'selected':''}>Enkelzijdig</option></select></div><div><label>Binding (bestelafspraak)</label><select onchange="draft.body.binding=this.value;dirty=true"><option value="wire-o" ${draft.body.binding==='wire-o'?'selected':''}>Wire-o / spiraal</option><option value="other" ${draft.body.binding==='other'?'selected':''}>Andere binding: afstemmen</option></select></div></div>${isBook?`<label>Werkstatus</label><select onchange="draft.body.status=this.value;dirty=true">${['Concept','Gecontroleerd','Verzonden'].map(x=>`<option ${draft.body.status===x?'selected':''}>${x}</option>`).join('')}</select>`:''}<div style="border-top:1px solid var(--line);margin-top:18px;padding-top:10px"><h3>Inhoudsopgave en nummering</h3><p class="muted">Voeg in de bibliotheek een inhoudsopgaveveld en paginanummers toe op de gewenste pagina’s. Positie en lettertype stelt u daar per veld in.</p>${draft.body.contents||draft.body.pageNumbers?`<div class="notice">Dit boekje gebruikt nog de eerdere automatische instellingen.<button type="button" onclick="draft.body.contents=false;draft.body.pageNumbers=false;dirty=true;renderDraft()">Gebruik uitsluitend velden uit de bouwstenen</button></div>`:''}<p class="muted">De eerste PDF-pagina telt als 1. Inhoudsopgave en blanco’s tellen mee; toegevoegde blanco’s krijgen geen zichtbaar nummer. De inhoudsopgave verwijst naar deze PDF-paginanummers.</p></div><p class="muted">${draft.body.format==='A5'?'A5 liggend':'A4 staand'} · ${pageCount()} PDF-pagina’s${draft.body.duplex?' inclusief eventuele blanco’s':''}. ${draft.body.contents?'Dit is vóór invoegen van de inhoudsopgave; het definitieve aantal staat bij de export. ':''}Omslag en bindmarge eerst afstemmen met de drukker.</p></div><div style="margin:18px 0" class="bar"><h2 style="margin:0">Hoofdstukken</h2><div class="actions"><button onclick="chooseBlock()">+ Bouwsteen</button><button onclick="newChoice()">+ Keuzepagina</button>${isBook?`<button onclick="addOneOff(false)">+ Eenmalige PDF</button><button onclick="addOneOff(true)">+ Reisschema toevoegen</button><button onclick="googleImport(true)">+ Google-reisschema</button>`:''}</div></div><p class="muted">Sleep een hoofdstuk of gebruik de pijlen. Alle pagina’s blijven samen.</p>${draft.body.sections.map((s,i)=>{if(s.choice)return choiceCard(s,i);let newer=find(s.block);return `<div class="section" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${i}')" ondragover="event.preventDefault()" ondrop="dropSection(event,${i})"><img src="/files/preview/${s.asset}/0" alt=""><div class="grow"><h3>${esc(s.title)}</h3><span class="muted">${s.pages} pagina’s · ${s.oneOff?'Eenmalige PDF':'v'+(s.revision||1)}</span><label class="check"><input type="checkbox" ${s.recto?'checked':''} onchange="draft.body.sections[${i}].recto=this.checked;dirty=true;renderDraft()">Begin op rechterpagina</label>${newer&&newer.revision>s.revision?`<button class="small" onclick="updateSection(${i})">Nieuwere versie beschikbaar</button>`:''}</div><div><button class="small" aria-label="Omhoog" onclick="move(${i},-1)">↑</button><button class="small" aria-label="Omlaag" onclick="move(${i},1)">↓</button><button class="small" aria-label="Verwijderen" onclick="removeSection(${i})">×</button><br><button class="small" onclick="previewSection(${i})">Bekijk</button>${s.oneOff?`<button class="small" onclick="editOneOff(${i})">Titel aanpassen</button>${s.googleDoc?`<button class="small" onclick="reviewGoogleOneOff(${i})">Pagina’s kiezen / vernieuwen</button>`:''}`:''}</div></div>`}).join('')||'<div class="empty">Voeg een eerste bouwsteen toe.</div>'}</div><div><div class="panel"><h2>${isBook?'Persoonlijke gegevens':'Velden in dit sjabloon'}</h2><p class="muted">${isBook?'Deze gegevens gelden in het hele boekje. Afwijkingen per hoofdstuk stelt u in via Bekijk.':'Bij het maken van een boeking worden deze gegevens ingevuld.'}</p>${prefilledEditors()}${keys().map(k=>`<label>${esc(k)}</label><textarea rows="2" ${!isBook?'disabled':''} oninput="setValue('${k}',this.value)">${esc(draft.body.values[k]||'')}</textarea>`).join('')||(prefilledEditors()?'':'<p>Nog geen invulvelden. Stel velden in bij een bouwsteen in de bibliotheek.</p>')}</div>${isBook?`<div class="panel" style="margin-top:20px"><h2>Drukbestand</h2><p>Bij het maken van de PDF worden de nieuwste bouwsteenversies gebruikt, ook binnen keuzepagina’s. Uw ingevulde teksten blijven behouden. Eerdere PDF’s blijven bewaard.</p><div class="actions"><button class="primary" onclick="exportBook(this)">Controleren & PDF maken</button><button onclick="exportBook(this,true)">Digitale proef bekijken</button></div><div id="exportResult"></div><p class="muted">De export bewaart originele PDF-pagina’s. Dit is geen automatische PDF/X-goedkeuring.</p></div><div class="panel" style="margin-top:20px"><h2>Eerdere drukversies</h2>${state.exports.filter(e=>e.book_id===draft.id).map(e=>`<div class="history"><a target="_blank" href="/files/export/${e.id}">${esc(e.created)} · ${e.report.pages} pagina’s</a> · <a target="_blank" href="/digital/${e.id}">Digitale proef</a></div>`).join('')||'<p class="muted">Nog geen PDF gemaakt.</p>'}</div>`:''}</div></div>`}

function move(i,d){let n=i+d;if(n<0||n>=draft.body.sections.length)return;[draft.body.sections[i],draft.body.sections[n]]=[draft.body.sections[n],draft.body.sections[i]];dirty=true;renderDraft()}

function dropSection(e,n){e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(i)||i<0||i>=draft.body.sections.length)return;let s=draft.body.sections.splice(i,1)[0];draft.body.sections.splice(n,0,s);dirty=true;renderDraft()}

function removeSection(i){draft.body.sections.splice(i,1);dirty=true;renderDraft()}

function updateSection(i){if(!confirm('Dit hoofdstuk vervangen door de nieuwste bibliotheekversie? Controleer daarna de velden.'))return;let s=draft.body.sections[i];draft.body.sections[i]={...snapshot(find(s.block)),recto:s.recto,values:s.values};dirty=true;renderDraft()}

function resetPicker(){Object.assign(pickerFilters,{q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false});const panel=$('#modal .block-picker .panel');panel.outerHTML=browserControls(true);drawLibrary(true)}



function closeModal(){if(googlePagePick){googlePagePick.resolve(null);googlePagePick=null;}$('#modal').close()}

async function persistDraft(){const r=await api('/api/save',draft);draft.id=r.id;draft.revision=r.revision;dirty=false;await refresh();return r}

function saveDraft(){run(async()=>{await persistDraft();toast('Opgeslagen');renderDraft()})}

function saveAs(){run(async()=>{const title=prompt('Naam voor het nieuwe reissjabloon',draft.title);if(!title)return;const b=clone(draft.body);if(b.sections.some(s=>s.oneOff)){if(!confirm('Eenmalige PDF’s zijn alleen voor deze boeking en worden niet in het sjabloon opgenomen. Doorgaan?'))return;b.sections=b.sections.filter(s=>!s.oneOff)}b.values={};b.sections.forEach(s=>s.values={});await api('/api/save',{kind:'template',title,body:b});await refresh();toast('Nieuw reissjabloon opgeslagen')})}

function previewSection(i){let s=draft.body.sections[i];s=s.choice?s.selected:s;if(!s)return;$('#modal').innerHTML=`<div class="bar"><h2>${esc(s.title)}</h2><button onclick="closeModal()">Sluiten</button></div><div class="two"><div style="max-height:70vh;overflow:auto">${Array.from({length:s.pages},(_,n)=>`<img style="width:100%;margin-bottom:15px;border:1px solid #ddd" src="/files/preview/${s.asset}/${n}" alt="Pagina ${n+1}">`).join('')}</div><div><p class="muted">Bronvoorbeeld zonder personalisatie. De gemaakte druk-PDF toont het eindresultaat.</p><h3>Afwijkende gegevens voor dit hoofdstuk</h3><p class="muted">Laat leeg om het algemene boekingsveld te gebruiken.</p>${[...new Set(s.fields.filter(f=>f.type!=='prefilled').flatMap(fieldKeys))].map(k=>`<label>${esc(k)}</label><input value="${esc(s.values?.[k]||'')}" oninput="sectionValue(${i},'${k}',this.value)">`).join('')}</div></div>`;$('#modal').showModal()}

function sectionValue(i,k,v){let s=draft.body.sections[i];s=s.choice?s.selected:s;s.values??={};if(v)s.values[k]=v;else delete s.values[k];dirty=true}

function pickFile(cb){const input=document.createElement('input');input.type='file';input.accept='application/pdf';input.onchange=()=>{if(input.files[0])run(()=>cb(input.files[0]))};input.click()}

function uploadBlock(){const inherited=previousUploadMetadata();fitExamples={};pickFile(async file=>{toast('PDF wordt gecontroleerd…');let a=await api('/api/upload?title='+encodeURIComponent(file.name),await file.arrayBuffer(),true);editor={kind:'block',title:file.name.replace(/\.pdf$/i,''),body:{asset:a.id,pages:a.pages,meta:a.meta,format:a.format,category:'Algemeen',...inherited,fields:(inherited.fields||[]).filter(f=>f.page<a.pages),checked:'',archived:false}};selectedField=-1;previewPage=0;renderEditor();$('#modal').showModal();const skipped=(inherited.fields||[]).filter(f=>f.page>=a.pages);if(skipped.length)toast('Niet overgenomen: '+skipped.map(f=>f.key+' (pagina '+(f.page+1)+')').join(', ')+'. Deze pagina’s ontbreken in de nieuwe PDF.')})}

function editBlock(id){fitExamples={};editor=clone(find(id));selectedField=-1;previewPage=0;renderEditor();$('#modal').showModal()}

function renderEditorContent(){fitRun++;let e=editor;let f=e.body.fields[selectedField];$('#modal').innerHTML=`<div class="bar"><h2>Bouwsteen beheren</h2><div class="actions"><button onclick="closeModal()">Annuleren</button><button class="primary" onclick="saveBlock()">Opslaan</button></div></div><div class="two"><div><div class="bar"><span>Voorbeeldpagina</span><select style="width:140px" onchange="previewPage=Number(this.value);selectedField=-1;renderEditor()">${Array.from({length:e.body.pages},(_,n)=>`<option value="${n}" ${n===previewPage?'selected':''}>${n+1} / ${e.body.pages}</option>`).join('')}</select></div><p class="muted">${e.body.googleDoc?'Bewerk de inhoud in Google Docs. Paginanummers stelt u rechts per pagina in.':'Klik op de pagina om een invulveld te plaatsen. Posities zijn percentages vanaf linksboven.'}</p><div class="preview" onclick="placeField(event)"><img src="/files/preview/${e.body.asset}/${previewPage}" alt="Voorbeeldpagina">${e.body.fields.map((f,i)=>f.page===previewPage?`<div class="fieldbox ${i===selectedField?'selected':''}" style="${f.type==='pageNumber'?numberBadgeStyle(f):`left:${f.x}%;top:${f.y}%;width:${f.w}%;height:${f.h}%`}">${f.type==='pageNumber'?'88':esc(f.key)}</div>`:'').join('')}</div></div><div class="fields"><label>Naam</label><input value="${esc(e.title)}" oninput="editor.title=this.value;showDuplicateTitle()"><div id="duplicateTitleWarning" role="status"></div><label>Titel voor inhoudsopgave</label><input value="${esc(e.body.tocTitle||'')}" placeholder="Leeg = naam van de bouwsteen" maxlength="300" oninput="editor.body.tocTitle=this.value"><label class="check"><input type="checkbox" ${e.body.tocHidden?'checked':''} onchange="editor.body.tocHidden=this.checked">Verbergen in inhoudsopgave</label>${metadataEditor(e.body)}${extraMetadata(e.body)}<label>Inhoud gecontroleerd op</label><input type="date" value="${esc(e.body.checked)}" oninput="editor.body.checked=this.value"><label class="check"><input type="checkbox" ${e.body.archived?'checked':''} onchange="editor.body.archived=this.checked">Archiveren voor nieuwe boekjes</label>${e.body.googleDoc?googleSourcePanel(e.body):'<button onclick="replacePdf()">Nieuwe PDF-versie uploaden</button>'}<p class="muted">Bij opnieuw genereren gebruiken boekjes de nieuwste bouwsteenversie. Bij vervangen worden invulvelden opnieuw ingesteld.</p><h3>Deze pagina · ${previewPage+1}</h3><label class="check"><input type="checkbox" ${e.body.fields.some(x=>x.page===previewPage&&x.type==='pageNumber')?'checked':''} onchange="togglePageNumber(this.checked)">Paginanummer op deze pagina</label><button type="button" onclick="resetNumberDefaults()">Nummering deze pagina: nieuwe standaard</button><button type="button" onclick="addContentsField()">+ Inhoudsopgaveveld</button><p class="muted">Paginanummer: zwart blokje 9 × 7 mm, witte cijfers in Open Sans vet 10 pt. Het blokje wordt gecentreerd rond de nummerpositie. Selecteer het veld om de positie te wijzigen. De nummerstijl staat vast. De inhoudsopgave wordt gevuld bij het maken van het boekje.</p><h3>Invulvelden en tekstblokken</h3><select id="editorFieldSelect" onchange="selectedField=Number(this.value);if(selectedField>=0)previewPage=editor.body.fields[selectedField].page;renderEditor()"><option value="-1">Selecteer een veld</option>${e.body.fields.map((f,i)=>`<option value="${i}" ${i===selectedField?'selected':''}>${esc(f.key)} · p${f.page+1}</option>`).join('')}</select>${f?`<label>Soort</label><select id="editorFieldType" onchange="fieldType(this.value)"><option value="field" ${!f.type||f.type==='field'?'selected':''}>Los invulveld</option><option value="text" ${f.type==='text'?'selected':''}>Persoonlijk tekstblok</option><option value="prefilled" ${f.type==='prefilled'?'selected':''}>Vooraf ingevulde tekst (wijzigbaar)</option><option value="contents" ${f.type==='contents'?'selected':''}>Inhoudsopgave</option><option value="pageNumber" ${f.type==='pageNumber'?'selected':''}>Paginanummer</option></select><label>${f.type==='text'?'Naam van dit tekstblok':'Veldnaam (bijv. reizigersnamen)'}</label><input value="${esc(f.key)}" oninput="fieldSet('key',this.value)">${['text','prefilled'].includes(f.type)?`<label>Standaardtekst / tekst met invulcodes</label><div class="actions" style="margin:8px 0"><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('bold')"><b>Vet</b></button><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('italic')"><i>Cursief</i></button><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('heading')">Kopje</button><button type="button" class="small" onmousedown="event.preventDefault()" onclick="formatText('bullet')">Opsomming</button></div><textarea id="blockText" rows="8" oninput="fieldSet('template',this.value)" placeholder="Beste {{aanhefnaam}},



Uw reis naar {{bestemming}} begint op {{vertrekdatum}}.">${esc(f.template||'')}</textarea><p class="muted">Gebruik {{veldnaam}} voor persoonlijke gegevens. Enter begint een nieuwe regel; een lege regel scheidt alinea’s. Regels worden automatisch afgebroken binnen de breedte. Opmaak wordt in de PDF toegepast: **vet**, *cursief* en # Kopje op een eigen regel. Selecteer tekst en gebruik de knoppen.</p><div id="detectedKeys" class="muted">Gevraagde gegevens: ${fieldKeys(f).map(esc).join(', ')||'geen'}</div>`:''}<div class="row">${['x','y','w','h'].map((k,i)=>`<div><label>${['Links %','Boven %','Breedte %','Hoogte %'][i]}</label><input type="number" step="0.1" value="${f[k]}" oninput="fieldSet('${k}',Number(this.value))"></div>`).join('')}${!['contents','pageNumber'].includes(f.type)?`<div><label>Uitlijning</label><select id="fieldAlignment" onchange="fieldSet('align',this.value)">${[['left','Links'],['center','Gecentreerd'],['right','Rechts']].map(([v,t])=>`<option value="${v}" ${(f.align||'left')===v?'selected':''}>${t}</option>`).join('')}</select><p class="muted">Binnen de breedte van dit tekstvak.</p></div>`:''}<div><label>Lettertype</label><select ${f.type==='pageNumber'?'disabled':''} onchange="fieldSet('font',this.value)">${['Open Sans','Montserrat'].map(name=>`<option ${ (f.type==='pageNumber'?'Open Sans':f.font||'Open Sans')===name?'selected':''}>${name}</option>`).join('')}</select></div><div><label>Lettergrootte (pt)</label><input type="number" min="6" max="72" step="0.5" value="${f.type==='pageNumber'?10:f.size||11}" ${f.type==='pageNumber'?'disabled':''} oninput="fieldSet('size',Number(this.value))"></div><div><label>Kleur</label><input type="color" ${f.type==='pageNumber'?'disabled':''} value="${f.type==='pageNumber'?'#ffffff':f.color}" oninput="fieldSet('color',this.value)"></div></div><p class="muted">Standaard Open Sans 11 pt. Lettertype en grootte zijn aanpasbaar. Regelafstand 150%; lettertype ingesloten in de PDF.</p><label class="check"><input type="checkbox" ${f.required?'checked':''} oninput="fieldSet('required',this.checked)">Verplicht invullen</label><button onclick="editor.body.fields.splice(selectedField,1);selectedField=-1;renderEditor()">Veld verwijderen</button><div style="border-top:1px solid var(--line);margin-top:20px;padding-top:12px"><h3>Tekstpassing controleren</h3><p class="muted">Controle met dezelfde lettergrootte, opmaak en regelafstand als de PDF. Vul voorbeeldgegevens in; langere klantgegevens kunnen later meer ruimte vragen.</p>${fieldKeys(f).map(k=>`<label>Voorbeeld: ${esc(k)}</label><input value="${esc(fitExamples[k]||'')}" placeholder="Voorbeeldwaarde" data-fit-key="${esc(k)}" oninput="fitExamples[this.dataset.fitKey]=this.value;invalidateFit()">`).join('')}<button type="button" style="margin-top:12px" onclick="checkFit()">Controleer tekstpassing</button><div id="fitResult" role="status" aria-live="polite" style="margin-top:12px"></div></div>`:'<p class="muted">Klik op een lege plek in het ontwerp om een veld toe te voegen. Kies daarna ‘Persoonlijk tekstblok’ voor een volledige alinea met invulcodes.</p>'}</div></div>`}

function togglePageNumber(enabled){editor.body.numberingConfigured=true;if(enabled){editor.body.fields.push({key:'Paginanummer',type:'pageNumber',page:previewPage,...numberDefaults(),font:'Open Sans',color:'#183c3c',required:false});selectedField=editor.body.fields.length-1}else{editor.body.fields=editor.body.fields.filter(f=>!(f.page===previewPage&&f.type==='pageNumber'));selectedField=-1}renderEditor()}

function addContentsField(){if(editor.body.googleDoc){toast('Gebruik een vaste PDF voor de inhoudsopgave.');return;}editor.body.fields.push({key:'Inhoudsopgave',type:'contents',page:previewPage,x:10,y:20,w:80,h:65,size:11,font:'Open Sans',color:'#183c3c',required:false});selectedField=editor.body.fields.length-1;renderEditor()}

function placeField(ev){if(editor.body.googleDoc){toast('Bewerk tekst in Google Docs. Paginanummers kunt u hieronder instellen.');return;}const r=ev.currentTarget.getBoundingClientRect();const x=Math.max(0,Math.min(90,(ev.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(94,(ev.clientY-r.top)/r.height*100));editor.body.fields.push({key:'veld_'+(editor.body.fields.length+1),page:previewPage,x:Math.round(x*10)/10,y:Math.round(y*10)/10,w:Math.min(50,100-x),h:5,size:11,color:'#183c3c',required:true});selectedField=editor.body.fields.length-1;renderEditor()}

function formatText(kind){const area=$('#blockText');if(!area)return;let start=area.selectionStart,end=area.selectionEnd,text=area.value;let replacement;if(kind==='bullet'){start=text.lastIndexOf('\n',start-1)+1;replacement=text.slice(start,end).split('\n').map(t=>'- '+t).join('\n')}else if(kind==='heading'){start=text.lastIndexOf('\n',start-1)+1;replacement='# '+text.slice(start,end)}else{const mark=kind==='bold'?'**':'*';replacement=mark+(text.slice(start,end)||'tekst')+mark}area.value=text.slice(0,start)+replacement+text.slice(end);fieldSet('template',area.value);area.focus();area.setSelectionRange(start,start+replacement.length)}

function fieldType(type){if(editor.body.googleDoc&&type!=='pageNumber'){toast('Bij Google-bronnen zijn alleen paginanummervelden beschikbaar.');renderEditor();return;}const f=editor.body.fields[selectedField];f.type=type;if(type==='contents'){f.key='Inhoudsopgave';f.required=false;f.h=Math.min(60,100-f.y)}if(type==='pageNumber'){editor.body.numberingConfigured=true;f.key='Paginanummer';f.required=false;Object.assign(f,numberDefaults(),{font:'Open Sans'})}if(type==='prefilled'){f.template??='U krijgt een Interrail Pas met 4 reisdagen. Deze zijn bedoeld voor:\n- Heenreis\n- Terugreis';}if(['text','prefilled'].includes(type)){f.template??='Beste {{aanhefnaam}},\n\nUw reis naar {{bestemming}} begint op {{vertrekdatum}}.';f.h=Math.max(f.h,Math.min(25,100-f.y))}renderEditor()}

function fieldSet(k,v){invalidateFit();const f=editor.body.fields[selectedField];f[k]=v;const detected=$('#detectedKeys');if(detected)detected.textContent='Gevraagde gegevens: '+(fieldKeys(f).join(', ')||'geen');const current=editor.body.fields.filter(x=>x.page===previewPage).indexOf(f);const box=$('#modal').querySelectorAll('.fieldbox')[current];if(box){if(f.type==='pageNumber'){box.textContent='88';box.style.cssText=numberBadgeStyle(f)}else{box.textContent=f.key;Object.assign(box.style,{left:f.x+'%',top:f.y+'%',width:f.w+'%',height:f.h+'%'})}}$('#modal').querySelectorAll('option').forEach(o=>{if(o.textContent.includes(' · p')&&Number(o.value)===selectedField)o.textContent=f.key+' · p'+(f.page+1)})}

function replacePdf(){if(!confirm('Nieuwe PDF uploaden en invulvelden voor deze bouwsteen opnieuw instellen? Bestaande boekjes behouden hun versie.'))return;pickFile(async file=>{let a=await api('/api/upload?title='+encodeURIComponent(file.name),await file.arrayBuffer(),true);delete editor.body.googleDoc;Object.assign(editor.body,{asset:a.id,pages:a.pages,meta:a.meta,format:a.format,fields:[]});previewPage=0;selectedField=-1;renderEditor()})}

function invalidateFit(){fitRun++;const r=$('#fitResult');if(r)r.textContent='Gewijzigd — controleer de tekstpassing opnieuw.'}

function showFit(result){const target=$('#fitResult');if(!target)return;target.innerHTML=result.results.map(r=>r.dynamic?`<div class="notice"><b>${esc(r.name)} · pagina ${r.page}</b><br>Wordt automatisch gevuld en gecontroleerd bij het maken van de PDF.</div>`:`<div class="${r.fits?'notice':'error'}"><b>${esc(r.name)} · pagina ${r.page}: ${r.fits?'Past met deze voorbeeldgegevens':'Past niet'}</b><br>Benodigde hoogte: ${r.heightPercent}%. Beschikbaar: ${r.availablePercent}%.<br>${esc(r.font||'Open Sans')} ${r.size} pt · regelafstand 150%.${!r.widthFits?'<br>De tekst is ook breder dan het vlak.':''}${r.exampleKeys.length?'<br>Niet ingevuld; als voorbeeld gebruikt: '+r.exampleKeys.map(k=>esc('['+k+']')).join(', '):''}</div>`).join('')||'Geen tekstvelden om te controleren.'}

async function checkFit(){const seq=++fitRun;const target=$('#fitResult');if(target)target.textContent='Tekstpassing wordt gecontroleerd…';try{const result=await api('/api/check-layout',{body:editor.body,values:fitExamples});if(seq===fitRun)showFit(result);return result}catch(e){if(seq===fitRun&&target)target.textContent='Controle niet gelukt: '+e.message;return null}}

async function saveBlock(){const button=$('#modal').querySelector('button.primary');if(button.disabled)return;button.disabled=true;button.textContent='Opslaan…';try{const isNewUpload=!editor.id;await refresh();showDuplicateTitle();if(!confirmDuplicateTitle())return;if(!confirmDestination())return;const fit=await api('/api/check-layout',{body:editor.body,values:fitExamples});const saved=await api('/api/save',editor);editor.id=saved.id;editor.revision=saved.revision;await refresh();if(isNewUpload){librarySort='newest';libraryLimit=recentUploadLimit;Object.assign(libraryFilters,{q:'',category:'',country:'',pageType:'',tag:'',format:'',archived:false})}if(!fit.fits){showFit(fit);toast('Bouwsteen opgeslagen. Let op: de tekst past nog niet met deze voorbeeldgegevens. Pas het vlak aan en sla opnieuw op.')}else{closeModal();render();toast('Bouwsteen opgeslagen. Tekstpassing gecontroleerd met voorbeeldgegevens.')}}catch(e){toast('Niet opgeslagen: '+e.message)}finally{button.disabled=false;button.textContent='Opslaan'}}

let sharedEditor=null;

function editSharedChoice(id){sharedEditor=id?clone(find(id)):{kind:'choice',title:'',body:{format:'A4',archived:false,slot:{choice:'manual',title:'',options:[],selected:null,country:'Nederland',destination:''}}};renderSharedEditor();$('#modal').showModal()}

function renderSharedEditor(){const e=sharedEditor,b=e.body,s=b.slot;const options=sharedOptions();let blocks=byKind('block').filter(o=>!o.body.archived&&o.body.format===b.format);const retained=(s.options||[]).filter(o=>!blocks.some(b=>b.id===o.block));$('#modal').innerHTML=`<div class="bar"><h2>Herbruikbare keuzepagina</h2><button onclick="closeModal()">Annuleren</button></div><p class="muted">Wijzigingen gelden voor nieuwe toevoegingen. Eerdere kopieën in sjablonen en boekingen blijven behouden.</p><label>Naam</label><input id="sharedTitle" value="${esc(e.title)}" oninput="sharedEditor.title=this.value"><div class="row"><div><label>Formaat</label><select onchange="sharedFormat(this.value)">${['A4','A5'].map(f=>`<option ${b.format===f?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Soort</label><select onchange="sharedEditor.body.slot.choice=this.value;sharedEditor.body.slot.selected=null;renderSharedEditor()"><option value="manual" ${s.choice==='manual'?'selected':''}>Vooraf geselecteerde bouwstenen</option><option value="route" ${s.choice==='route'?'selected':''}>Routes</option></select></div></div>${s.choice==='manual'?`<label>Toegestane bouwstenen</label>${blocks.map(o=>`<label class="check"><input type="checkbox" data-shared-block="${o.id}" ${s.options.some(x=>x.block===o.id)?'checked':''} onchange="sharedToggle(this.dataset.sharedBlock,this.checked)">${esc(o.title)} · ${o.body.pages} pagina’s</label>`).join('')}${retained.map(o=>`<label class="check"><input type="checkbox" checked data-shared-block="${o.block}" onchange="sharedToggle(this.dataset.sharedBlock,this.checked)">${esc(o.title)} (bewaarde versie)</label>`).join('')}`:`<label>Land</label><select onchange="sharedRoute('country',this.value)">${state.countries.map(c=>`<option ${s.country===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label>Bestemming (optioneel)</label><input list="sharedDestinations" value="${esc(s.destination)}" onchange="sharedRoute('destination',this.value)"><datalist id="sharedDestinations">${uniqueValues(byKind('block').filter(o=>categories(o.body).includes('Routes')&&norm(o.body.country)===norm(s.country)).map(o=>o.body.destination||'')).map(d=>`<option value="${esc(d)}">`).join('')}</datalist>`}<label>Standaardkeuze</label><select onchange="sharedSelect(this.value)"><option value="">Niet ingesteld</option>${options.map(o=>`<option value="${o.block}" ${s.selected?.block===o.block?'selected':''}>${esc(o.title)}</option>`).join('')}</select><label class="check"><input type="checkbox" ${b.archived?'checked':''} onchange="sharedEditor.body.archived=this.checked">Archiveren voor nieuwe toevoegingen</label><button class="primary" id="saveSharedChoice" onclick="saveSharedChoice(this)">Opslaan in bibliotheek</button>`}

function sharedFormat(format){sharedEditor.body.format=format;sharedEditor.body.slot.options=[];sharedEditor.body.slot.selected=null;renderSharedEditor()}

function sharedRoute(k,v){const s=sharedEditor.body.slot;s[k]=v.trim();if(k==='country')s.destination='';s.selected=null;renderSharedEditor()}

let librarySort='newest',libraryLimit=0,recentUploadLimit=10,reuseLastMetadata=false;

let lastRenderedEditor=null;

function visibleLibraryItems(){const items=libraryItems(false);return libraryLimit?items.slice(0,libraryLimit):items}

function blockCount(id){return draft.body.sections.filter(s=>(s.choice?s.selected?.block:s.block)===id).length}

function drawLibrary(pick){let all=libraryItems(pick),items=!pick&&libraryLimit?all.slice(0,libraryLimit):all;const target=$(pick?'#pickerResults':'#libraryResults');target.innerHTML=`${pick?'':`<div class="actions" style="margin:12px 0"><button onclick="selectVisibleBlocks()">Selecteer alle getoonde</button><button onclick="selectedBlocks.clear();drawLibrary(false)">Selectie wissen</button><button id="bulkEditButton" onclick="openBulkEditor()" ${selectedBlocks.size?'':'disabled'}>Bewerk ${selectedBlocks.size} bouwstenen</button>${lastBulkUndo?'<button onclick="undoBulk()">Laatste groepswijziging ongedaan maken</button>':''}</div>`}<p class="muted">${items.length} van ${all.length} bouwstenen · ${!pick&&librarySort==='newest'?'nieuwste eerst':'alfabetisch'}</p><div class="${pick?'':'library-cards'}">${items.map(o=>`<div class="section" data-block-row="${o.id}">${pick?'':`<input type="checkbox" style="width:auto" aria-label="Selecteer ${esc(o.title)}" ${selectedBlocks.has(o.id)?'checked':''} onchange="toggleBulk('${o.id}',this.checked)">`}<img loading="lazy" style="width:48px;height:68px;flex-shrink:0" src="/files/preview/${o.body.asset}/0" alt="Voorbeeld ${esc(o.title)}"><div class="grow"><h3>${esc(o.title)}</h3><p class="muted">${esc([...categories(o.body),o.body.country||'Algemeen'].join(' · '))}<br>${o.body.pages} pagina’s · ${esc(o.body.format||'Onbekend')} · v${o.revision}${o.body.archived?' · Gearchiveerd':''}</p>${(o.body.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')}</div><div class="${pick?'picker-add-actions':''}">${pick?`<span data-count="${o.id}" class="picker-added" role="status"></span>`:''}<button class="${pick?'picker-add-button':'small'}" data-add="${o.id}" onclick="${pick?'addBlock':'editBlock'}('${o.id}')">${pick?'Toevoegen':'Beheren'}</button>${pick?'':`<br><button class="small" style="margin-top:6px" onclick="duplicateBlock('${o.id}')">Dupliceren</button>`}</div></div>`).join('')||`<div class="empty">Geen bouwstenen gevonden.${pick?' Controleer het boekformaat en de filters.':' Pas de zoekterm of filters aan.'}</div>`}</div>`;if(pick)updatePickerFeedback()}

function chooseBlock(){run(async()=>{await refresh();pickerAdded=[];pickerBusy=false;$('#modal').innerHTML=`<div class="block-picker"><div class="bar"><div><h2>Bouwstenen toevoegen</h2><span class="muted">Alleen ${draft.body.format==='A5'?'A5 liggend':'A4 staand'} · actieve bouwstenen</span></div><button class="primary" id="pickerDone" onclick="closeModal()">Klaar</button></div>${browserControls(true)}<div class="actions"><button class="small" onclick="resetPicker()">Filters wissen</button><button class="small" id="pickerUndo" onclick="undoPicker()">Laatste toevoeging ongedaan maken</button></div><p id="pickerFeedback" class="muted" aria-live="polite"></p><div id="pickerResults" tabindex="0" aria-label="Beschikbare bouwstenen"></div></div>`;drawLibrary(true);$('#modal').showModal();$('#modal').scrollTop=0})}

function updatePickerFeedback(message){if(!$('#pickerDone'))return;$('#pickerDone').textContent='Klaar · '+pickerAdded.length+' toegevoegd';$('#pickerUndo').disabled=!pickerAdded.length||pickerBusy;if(message)$('#pickerFeedback').textContent=message;document.querySelectorAll('[data-count]').forEach(el=>{let n=blockCount(el.dataset.count);el.innerHTML=n?'<span class="picker-tick" aria-hidden="true">✓</span>'+(n>1?'<span class="picker-times">'+n+'×</span>':''):'';el.setAttribute('aria-label',n?n+' keer toegevoegd':'Nog niet toegevoegd');el.title=n?n+'× in dit '+(draft.kind==='book'?'boekje':'sjabloon'):''})}

function addBlock(id){if(pickerBusy)return;const o=find(id);if(!o||o.kind!=='block'||o.body.archived||o.body.format!==(draft.body.format||'A4'))return;pickerBusy=true;const button=document.querySelector(`[data-add="${id}"]`);if(button)button.disabled=true;try{const n=blockCount(id);if(n&&!confirm('“'+o.title+'” staat al '+n+'× in dit '+(draft.kind==='book'?'boekje':'sjabloon')+'. Nogmaals toevoegen?'))return;const section=snapshot(o);draft.body.sections.push(section);pickerAdded.push(section);dirty=true;renderDraft();updatePickerFeedback('✓ '+o.title+' toegevoegd.')}finally{setTimeout(()=>{pickerBusy=false;if(button?.isConnected)button.disabled=false;updatePickerFeedback()},450)}}

function undoPicker(){if(pickerBusy||!pickerAdded.length)return;const last=pickerAdded.pop(),i=draft.body.sections.indexOf(last);if(i>=0)draft.body.sections.splice(i,1);dirty=true;renderDraft();updatePickerFeedback('Toevoeging van '+last.title+' ongedaan gemaakt.')}

function toggleBulk(id,checked){if(checked)selectedBlocks.add(id);else selectedBlocks.delete(id);const button=$('#bulkEditButton');button.disabled=!selectedBlocks.size;button.textContent='Bewerk '+selectedBlocks.size+' bouwstenen'}

function selectVisibleBlocks(){visibleLibraryItems().forEach(o=>selectedBlocks.add(o.id));drawLibrary(false)}

function duplicateBlock(id){const original=find(id);editor=clone(original);delete editor.id;delete editor.revision;delete editor.uploadOrder;editor.title=original.title+' — kopie';editor.body.archived=false;fitExamples={};previewPage=0;selectedField=-1;renderEditor();$('#modal').showModal()}

function openBulkEditor(){const items=[...selectedBlocks].map(find).filter(o=>o?.kind==='block');if(!items.length)return;window.bulkItems=items.map(o=>({id:o.id,revision:o.revision}));$('#modal').innerHTML=`<div class="bar"><h2>Bewerk ${items.length} bouwstenen</h2><button onclick="closeModal()">Annuleren</button></div><p>Alleen ingevulde acties worden toegepast. Overige instellingen blijven behouden.</p><div class="row">${[['categoriesAdd','Categorieën toevoegen'],['categoriesRemove','Categorieën verwijderen'],['tagsAdd','Labels toevoegen'],['tagsRemove','Labels verwijderen']].map(([key,title])=>`<div><label>${title}</label><input id="bulk_${key}" placeholder="Niet wijzigen · of namen met komma’s"></div>`).join('')}<div><label>Land</label><select id="bulk_country"><option value="">Niet wijzigen</option>${['Algemeen',...(state.countries||[])].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label>Type pagina</label><select id="bulk_pageType"><option value="">Niet wijzigen</option>${pageTypes.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div><label>Inhoudsopgave</label><select id="bulk_tocHidden"><option value="">Niet wijzigen</option><option value="false">Tonen</option><option value="true">Verbergen</option></select></div></div><p class="muted">De volgende keer genereren gebruiken boekjes deze bijgewerkte bouwstenen.</p><button class="primary" onclick="applyBulk(this)">Controleer en opslaan</button>`;$('#modal').showModal()}

function applyBulk(button){run(async()=>{const changes={},summary=[];for(const [key,label] of [['categoriesAdd','Categorieën toevoegen'],['categoriesRemove','Categorieën verwijderen'],['tagsAdd','Labels toevoegen'],['tagsRemove','Labels verwijderen']]){const values=uniqueValues($('#bulk_'+key).value.split(',').map(x=>x.trim()).filter(Boolean));if(values.length){changes[key]=values;summary.push(label+': '+values.join(', '))}}for(const [key,label] of [['country','Land'],['pageType','Type pagina']]){const value=$('#bulk_'+key).value;if(value){changes[key]=value;summary.push(label+': '+value)}}const toc=$('#bulk_tocHidden').value;if(toc){changes.tocHidden=toc==='true';summary.push('Inhoudsopgave: '+(changes.tocHidden?'verbergen':'tonen'))}if(!Object.keys(changes).length){toast('Kies eerst wat u wilt wijzigen.');return}if(!confirm(window.bulkItems.length+' bouwstenen wijzigen?\n\n'+summary.join('\n')))return;button.disabled=true;try{const result=await api('/api/bulk',{items:window.bulkItems,changes});lastBulkUndo=result.undoId;await refresh();closeModal();selectedBlocks.clear();render();toast(result.count+' bouwstenen gewijzigd. Ongedaan maken staat boven de bibliotheek.')}finally{button.disabled=false}})}

function undoBulk(){run(async()=>{if(!lastBulkUndo)return;if(!confirm('De laatste groepswijziging ongedaan maken?'))return;const result=await api('/api/bulk-undo',{id:lastBulkUndo});lastBulkUndo=null;await refresh();render();toast('Groepswijziging bij '+result.count+' bouwstenen ongedaan gemaakt.')})}

function addOneOff(schedule=false){if(draft.kind!=='book')return;pickFile(async file=>{const a=await api('/api/upload?title='+encodeURIComponent(file.name),await file.arrayBuffer(),true);if(a.format!==(draft.body.format||'A4'))throw Error('Deze PDF is '+a.format+'. Dit boekje vereist '+(draft.body.format||'A4')+'. Kies een passende PDF.');const title=schedule?'Uw reisschema':prompt('Titel voor de inhoudsopgave',file.name.replace(/\.pdf$/i,''));if(!title?.trim())return;draft.body.sections.push({oneOff:true,title:title.trim(),tocTitle:title.trim(),asset:a.id,pages:a.pages,fields:[],values:{},recto:false,numberingConfigured:true});dirty=true;renderDraft();toast('Eenmalige PDF toegevoegd aan dit boekje; niet aan de bibliotheek.')})}

function editOneOff(i){const s=draft.body.sections[i];const title=prompt('Titel voor de inhoudsopgave',s.tocTitle||s.title);if(!title?.trim())return;s.title=title.trim();s.tocTitle=title.trim();dirty=true;renderDraft()}

let exportIntentDigital=false,exportPlan=null;

function exportBook(button,digital=false){run(async()=>{button.disabled=true;try{exportIntentDigital=digital;await refresh();refreshDraftBlocks();if(!await prepareGoogleBook())return;exportPlan=await api('/api/export-plan',{body:draft.body});renderExportCheck(exportPlan)}finally{button.disabled=false}})}

function renderExportCheck(p){const errors=p.errors||[];$('#modal').innerHTML=`<div class="bar"><h2>Controle vóór ${exportIntentDigital?'digitale proef':'PDF-export'}</h2><button onclick="closeModal();renderDraft()">Terug naar boekje</button></div><p>${p.pages} ${p.pages===1?'pagina':'pagina’s'} vóór eventuele vulling. De nieuwste bouwsteenversies zijn gecontroleerd.</p>${errors.length?`<div class="error"><b>${errors.length} aandachtspunt${errors.length===1?'':'en'} om op te lossen</b>${errors.map(e=>`<p><b>${esc(e.title)}</b><br>${esc(e.message)}${Number.isInteger(e.section)?`<br><button class="small" onclick="closeModal();renderDraft();previewSection(${e.section})">Bekijk hoofdstuk</button>`:''}</p>`).join('')}</div>`:'<div class="notice">Verplichte gegevens en tekstpassing zijn gecontroleerd.</div>'}${p.missing.length?`<div class="notice"><b>Niet ingestelde keuzes</b><p>${p.missing.map(esc).join('<br>')}</p><label class="check"><input id="skipChoices" type="checkbox">Deze keuzes overslaan en doorgaan</label></div>`:''}${p.needed?`<div class="notice">Het aantal pagina’s is niet deelbaar door vier.${p.canFill?`<label class="check"><input type="checkbox" id="fillPages" checked>${p.fillers.reduce((n,s)=>n+s.pages,0)} vulpagina’s vóór de laatste pagina toevoegen</label>`:'<p>Er zijn onvoldoende passende vulpagina’s ingesteld.</p>'}<p class="muted">Zonder vulling doorgaan is toegestaan.</p></div>`:''}<button class="primary" ${errors.length?'disabled':''} onclick="finishExport(this)">${exportIntentDigital?'Digitale proef maken':'PDF maken'}</button>`;$('#modal').showModal()}

function finishExport(button){run(async()=>{if(exportPlan.missing.length&&!$('#skipChoices')?.checked){toast('Bevestig dat de niet ingestelde keuzes mogen worden overgeslagen.');return}button.disabled=true;try{const fill=!!$('#fillPages')?.checked;const checked=await api('/api/export-plan',{body:draft.body,fill});if(checked.errors?.length||checked.libraryStamp!==exportPlan.libraryStamp){exportPlan=checked;renderExportCheck(checked);return}await persistDraft();const r=await api('/api/export',{id:draft.id,revision:draft.revision,skipChoices:true,fill,allowUneven:!fill,libraryStamp:checked.libraryStamp});await refresh();closeModal();renderDraft();$('#exportResult').innerHTML=`<div class="notice"><b>PDF gemaakt · ${r.report.pages} pagina’s</b><p>${r.report.blanks} blanco’s · ${r.report.fillersAdded||0} vulpagina’s.</p><div class="actions"><a class="button" href="${r.url}" target="_blank">Open druk-PDF</a><a class="button" href="/digital/${r.id}" target="_blank">Open digitale proef</a></div><p>${r.report.warnings.map(esc).join('<br>')}</p></div>`;if(exportIntentDigital){$('#modal').innerHTML=`<h2>Uw digitale proef staat klaar</h2><p>Deze versie gebruikt de zojuist gemaakte PDF. Alleen lokaal toegankelijk na inloggen.</p><a class="button" href="/digital/${r.id}" target="_blank" onclick="closeModal()">Open digitale reisgids</a> <button onclick="closeModal()">Sluiten</button>`;$('#modal').showModal()}}finally{button.disabled=false}})}



async function googleSettings(){return run(async()=>{const s=await api('/api/google/status');$('#modal').innerHTML=`<div class="bar"><h2>Google koppelen</h2><button onclick="closeModal()">Sluiten</button></div><p>${s.connected?'✓ Google is gekoppeld.':'Google is nog niet gekoppeld.'}</p><p>De boekjesmaker leest documenten met het gekoppelde account. Uw Google-documenten worden niet gewijzigd.</p>${s.configured?'<button class="primary" onclick="connectGoogle()">Aanmelden bij Google</button>':'<p>Voor online gebruik moet de beheerder eerst de Google-webkoppeling instellen in Railway. De lokale Windows-koppeling kan niet worden overgenomen.</p>'}<span id="googleSignIn"></span>${s.connected?'<button onclick="disconnectGoogle()">Google-koppeling verbreken</button>':''}<p class="muted">De koppeling geldt voor deze online boekjesmaker. Toegangsgegevens worden versleuteld opgeslagen.</p>`;if(!$('#modal').open)$('#modal').showModal()})}

function saveGoogleClient(){run(async()=>{const f=$('#googleClientFile').files[0];if(!f)throw Error('Kies het Google-clientbestand.');if(f.size>30000)throw Error('Dit lijkt geen Google-clientbestand.');await api('/api/google/configure',{config:await f.text()});await googleSettings();toast('Google-instellingen opgeslagen. Klik op Aanmelden bij Google.')})}

function connectGoogle(){run(async()=>{const r=await api('/api/google/connect',{});$('#googleSignIn').innerHTML=`<p><a class="button" target="_blank" rel="noopener" href="${esc(r.url)}">Open Google-aanmelding</a></p><p>Rond de aanmelding af in het nieuwe tabblad en keer daarna terug.</p><button onclick="googleSettings()">Aanmelding controleren</button>`})}

function disconnectGoogle(){if(!confirm('De online Google-koppeling verbreken? Bestaande PDF’s blijven bewaard.'))return;run(async()=>{await api('/api/google/disconnect',{});await googleSettings()})}

function googleImport(oneOff=false){$('#modal').innerHTML=`<div class="bar"><h2>${oneOff?'Eenmalig Google-reisschema':'Google Docs toevoegen'}</h2><button onclick="closeModal()">Annuleren</button></div><label>Link naar Google Docs</label><input id="googleUrl" type="url" placeholder="https://docs.google.com/document/d/…"><div class="row"><div><label>Formaat</label><select id="googleFormat" ${oneOff?'disabled':''}><option value="A5" ${!oneOff||draft.body.format==='A5'?'selected':''}>A5 liggend</option><option value="A4" ${oneOff&&draft.body.format!=='A5'?'selected':''}>A4 staand</option></select></div><div><label>Indeling</label><select id="googleLayout"><option value="route" ${oneOff?'':'selected'}>Routebeschrijving met kaarten</option><option value="text" ${oneOff?'selected':''}>Tekstpagina in twee kolommen</option></select></div></div>${oneOff?'':`<label class="check"><input id="googleAsRoute" type="checkbox" checked onchange="googleRouteRequired()">Beschikbaar maken voor routekeuzepagina’s (categorie Routes)</label><div class="row"><div><label for="googleCountry">Land <span id="googleCountryRequired">(verplicht)</span></label><select id="googleCountry" onchange="googleDestinationOptions()"><option value="">Kies een land…</option>${(state.countries||[]).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div><div><label for="googleDestination">Bestemming (optioneel)</label><input id="googleDestination" list="googleDestinations" maxlength="160" placeholder="Bijvoorbeeld Wenen"><datalist id="googleDestinations"></datalist></div></div><p class="muted">De route verschijnt na opslaan bij keuzepagina’s met hetzelfde formaat, land en eventueel bestemming. Een nieuwe bestemming wordt bij opslaan bevestigd.</p>`}<p>Zwarte tekst, titel in Montserrat, Open Sans 10,5 pt met regelafstand 1,6. Tekst loopt automatisch door naar volgende pagina’s. Alle tabbladen worden meegenomen.</p><p class="muted">Tekst binnen afbeeldingen behoudt de bronopmaak. Gewone tekst in Google Docs geeft het beste resultaat. Bewerk inhoud in Google Docs; in de boekjesmaker kunt u paginanummers plaatsen.</p><button class="primary" onclick="loadGoogleImport(this,${oneOff})">Document ophalen</button>`;$('#modal').showModal()}

function googleRouteRequired(){const required=$('#googleAsRoute').checked;$('#googleCountryRequired').textContent=required?'(verplicht)':'(optioneel)';$('#googleCountry').required=required}
function googleDestinationOptions(){const country=$('#googleCountry').value;$('#googleDestination').value='';$('#googleDestinations').innerHTML=uniqueValues(byKind('block').filter(o=>norm(o.body.country)===norm(country)).map(o=>o.body.destination||'')).map(d=>`<option value="${esc(d)}">`).join('')}
function loadGoogleImport(button,oneOff){run(async()=>{button.disabled=true;try{const isRoute=!oneOff&&$('#googleAsRoute').checked;const country=oneOff?'Algemeen':($('#googleCountry').value||'Algemeen');let destination=oneOff?'':$('#googleDestination').value.trim();if(isRoute&&!(state.countries||[]).includes(country)){$('#googleCountry').focus();throw Error('Kies een land voor deze route voordat u het document ophaalt.')}const existing=byKind('block').find(o=>norm(o.body.country)===norm(country)&&destination&&norm(o.body.destination)===norm(destination));if(existing)destination=existing.body.destination;const fetched=await api('/api/google/import',{url:$('#googleUrl').value.trim(),format:$('#googleFormat').value,layout:$('#googleLayout').value});const r=await chooseGooglePages(fetched);if(!r)return;const fields=Array.from({length:r.pages},(_,page)=>({key:'Paginanummer',type:'pageNumber',page,x:45,y:100-34/(r.format==='A5'?419.528:841.89)*100,w:10,h:3,size:10,font:'Open Sans',color:'#ffffff',required:false}));if(oneOff){draft.body.sections.push({oneOff:true,title:'Uw reisschema',tocTitle:'Uw reisschema',asset:r.asset,pages:r.pages,googleDoc:r.googleDoc,fields,numberingConfigured:true,values:{},recto:false});dirty=true;closeModal();renderDraft();toast('Google-reisschema toegevoegd, alleen aan dit boekje.')}else{editor={kind:'block',title:r.title,body:{asset:r.asset,pages:r.pages,format:r.format,googleDoc:r.googleDoc,fields,numberingConfigured:true,categories:isRoute?['Routes']:['Algemeen'],country,destination,pageType:r.googleDoc.layout==='route'?'Route':'Alleen tekst',tags:[],tocTitle:'',tocHidden:false,archived:false,checked:''}};previewPage=0;selectedField=-1;fitExamples={};renderEditor();toast('Document opgehaald. Controleer de pagina’s en sla de bouwsteen op.')}}finally{button.disabled=false}})}

function googleSourcePanel(b){return `<div class="notice"><b>Gekoppeld Google-document</b><p><a href="${esc(b.googleDoc.url)}" target="_blank" rel="noopener">Open bron in Google Docs</a></p><p>Automatisch vernieuwd bij het maken van een boekje. Montserrat / Open Sans · zwart · regelafstand 1,6. Laatst opgeslagen broncontrole: ${esc(b.googleDoc.checkedAt||'onbekend')}.</p><button onclick="refreshGoogleEditor(this)">Nu vernieuwen / pagina’s kiezen</button><p>${b.googleDoc.selectedPages?'Gekozen bronpagina’s: '+b.googleDoc.selectedPages.map(n=>n+1).join(', '):'Alle bronpagina’s worden meegenomen.'}</p><p class="muted">Inhoud wijzigen in Google Docs. Alleen paginanummers als extra velden; de tekst kan bij vernieuwing verschuiven.</p></div>`}

function refreshGoogleEditor(button){run(async()=>{button.disabled=true;try{const b=editor.body;const r=await reviewGooglePages(b);if(!r){renderEditor();return}Object.assign(b,r);previewPage=0;selectedField=-1;renderEditor();toast('Bron en paginaselectie vernieuwd. Controleer de pagina’s en sla op.')}finally{button.disabled=false}})}


let googlePagePick=null;
function chooseGooglePages(document,previous){return new Promise(resolve=>{
 googlePagePick={document,resolve};
 const chosen=previous||Array.from({length:document.pages},(_,n)=>n);
 $('#modal').innerHTML=`<div class="bar"><h2>Kies pagina’s om te importeren</h2><button onclick="closeModal()">Annuleren</button></div><p>${esc(document.title)} · ${document.pages} pagina’s in ${esc(document.format)}.</p><p>${previous?'Controleer uw eerdere selectie opnieuw: door wijzigingen kan de inhoud op een ander paginanummer staan.':'Alle pagina’s zijn geselecteerd. Vink uit wat u niet wilt meenemen.'}</p><div class="actions"><button onclick="googleSelectAll(true)">Alles selecteren</button><button onclick="googleSelectAll(false)">Selectie wissen</button><button class="primary" id="googlePageConfirm" onclick="confirmGooglePages(this)">Geselecteerde pagina’s gebruiken</button><span id="googlePageCount" role="status"></span></div><div class="grid">${Array.from({length:document.pages},(_,n)=>`<label class="card" style="padding:12px"><span class="check"><input class="google-page-choice" type="checkbox" value="${n}" ${chosen.includes(n)?'checked':''} onchange="googlePageCount()">Pagina ${n+1}</span><img loading="lazy" src="/files/preview/${document.asset}/${n}" alt="Voorbeeld pagina ${n+1}" style="width:100%;min-height:100px;object-fit:contain"><a href="/files/preview/${document.asset}/${n}" target="_blank" rel="noopener">Groter bekijken</a></label>`).join('')}</div>`;
 if(!$('#modal').open)$('#modal').showModal();googlePageCount();
 $('#modal').addEventListener('cancel',()=>{if(googlePagePick){googlePagePick.resolve(null);googlePagePick=null;}},{once:true});
})}
function googlePageCount(){const n=document.querySelectorAll('.google-page-choice:checked').length;$('#googlePageCount').textContent=n+' pagina’s geselecteerd';$('#googlePageConfirm').disabled=!n}
function googleSelectAll(value){document.querySelectorAll('.google-page-choice').forEach(c=>c.checked=value);googlePageCount()}
function confirmGooglePages(button){run(async()=>{button.disabled=true;try{const pick=googlePagePick;if(!pick)return;const pages=[...document.querySelectorAll('.google-page-choice:checked')].map(c=>Number(c.value));const result=await api('/api/google/select-pages',{document:pick.document,pages});if(googlePagePick!==pick)return;googlePagePick=null;pick.resolve(result)}finally{button.disabled=false}})}
async function reviewGooglePages(body){const previous=body.googleDoc.selectedPages;const fetched=await api('/api/google/import',{...body.googleDoc,selectedPages:null});const r=await chooseGooglePages(fetched,previous);if(!r)return null;const oldPages=previous||Array.from({length:body.pages},(_,n)=>n),newPages=r.googleDoc.selectedPages||Array.from({length:r.pages},(_,n)=>n);const old=body.fields||[];const fields=[];for(let page=0;page<newPages.length;page++){const index=oldPages.indexOf(newPages[page]),field=old.find(f=>f.type==='pageNumber'&&f.page===index);if(field)fields.push({...field,page});else if(index<0&&old.length)fields.push({key:'Paginanummer',type:'pageNumber',page,x:45,y:100-34/(r.format==='A5'?419.528:841.89)*100,w:10,h:3,size:10,font:'Open Sans',color:'#ffffff',required:false});}return {asset:r.asset,pages:r.pages,format:r.format,googleDoc:r.googleDoc,fields,numberingConfigured:true}}
function reviewGoogleOneOff(i){run(async()=>{const b=draft.body.sections[i],r=await reviewGooglePages(b);if(r){Object.assign(b,r);dirty=true;}closeModal();renderDraft()})}

async function prepareGoogleBook(){if(!draft.body.sections.some(s=>(s.choice?s.selected:s)?.googleDoc))return true;toast('Actuele Google-documenten ophalen…');let r=await api('/api/google/prepare',{body:draft.body});if(r.errors?.length){const message=r.errors.map(e=>e.title+': '+e.message).join('\n\n');if(!confirm(message+'\n\nWilt u voor deze PDF bewust de laatste opgeslagen versie gebruiken van bronnen die niet bereikbaar zijn?'))return false;r=await api('/api/google/prepare',{body:draft.body,allowCached:true})}draft.body=r.body;dirty=true;await refresh();if(r.warnings?.length)toast(r.warnings.join(' · '));return true}



async function init(){document.querySelector('#app').textContent='Toegang controleren…';const s=await api('/api/session');user=s.user;if(!user){location.href='/seinhuis';return}document.querySelector('#app').textContent='Bibliotheek ophalen…';await refresh();shell()}

function login(setup){run(async()=>{await api(setup?'/api/setup':'/api/login',{name:$('#name').value,password:$('#pass').value});await init()})}

init().catch(e=>{document.querySelector('#app').innerHTML='<div class="login"><h1>Laden niet gelukt</h1><p>'+esc(e.message)+'</p><a href="/seinhuis">Terug naar Seinhuis</a></div>'});

</script></html>
