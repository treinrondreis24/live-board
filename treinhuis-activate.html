<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treinhuis activeren</title><link rel="stylesheet" href="/admin-security.css"><script src="/treinhuis/activeren.js" defer></script></head><body><main><h1>Je Treinhuis-account activeren</h1><p>Stel je eigen wachtwoord en authenticator in. Je krijgt toegang tot het beheer van Kilometerkampioen.</p><form id="start"><label>Persoonlijk wachtwoord<input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="256" required></label><button>Authenticator instellen</button></form><form id="finish" hidden><p id="name"></p><img id="qr" alt="Scan met je authenticator" width="240" height="240"><p id="secret"></p><label>Code uit de authenticator<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label><button>Activeren en naar Treinhuis</button></form><p id="message" role="status"></p></main></body></html>
